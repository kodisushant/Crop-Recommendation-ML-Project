{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<main class="app"><div class="wrap account-wrap">
    <h1>Sign in</h1>
    <p>Sign in to save and view your history across devices.</p>
    <form id="account-form" class="panel">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
        <button id="account-submit" class="btn" type="submit">Sign in</button>
        <p id="account-message" class="note" role="status"></p>
    </form>
    <a href="/register">Create account</a>
</div></main>
{% endblock %}
