{% extends "base.html" %}{% block title %}Land Suitability Checker{% endblock %}{% block body %}<div class="app-head">
    <div class="wrap">
        <h1>Land Suitability Checker</h1>
        <p>Pick a crop, enter your land values and see how well they match the crop's ideal range.</p>
    </div>
</div>
<main class="app">
    <div class="wrap">
        <div class="two">
            <form id="form" novalidate>
                <div class="panel">
                    <h3><i class="fa-solid fa-wheat-awn"></i> Crop</h3><label for="crop">Select crop</label><select
                        id="crop" required></select>
                </div>
                <div class="panel">
                    <h3><i class="fa-solid fa-seedling"></i> Your land conditions</h3>
                    <div id="fields"></div>
                </div><button class="btn" id="go" type="submit"><span class="spinner"></span><i
                        class="fa-solid fa-clipboard-check"></i> Check suitability</button>
            </form>
            <div id="result">
                <div class="panel">
                    <div class="empty"><i class="fa-solid fa-seedling"></i>Your results will appear here.</div>
                </div>
            </div>
        </div>
    </div>
</main>{% endblock %}
