{% extends "base.html" %}{% block title %}Market Price Information{% endblock %}{% block body %}<div class="app-head">
    <div class="wrap">
        <h1>Market Price Information</h1>
        <p>Live mandi prices from Agmarknet (data.gov.in) when available, otherwise clearly labelled reference prices.
        </p>
    </div>
</div>
<main class="app">
    <div class="wrap">
        <form id="form" class="panel inl" novalidate>
            <div><label for="crop">Crop</label><select id="crop"></select></div>
            <div><label for="state">State</label><select id="state"></select></div><button class="btn" id="go"
                type="submit"><span class="spinner"></span><i class="fa-solid fa-magnifying-glass-dollar"></i> Get
                prices</button>
        </form>
        <div id="result">
            <div class="panel">
                <div class="empty"><i class="fa-solid fa-seedling"></i>Your results will appear here.</div>
            </div>
        </div>
    </div>
</main>{% endblock %}
