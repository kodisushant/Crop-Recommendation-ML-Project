{% extends "base.html" %}

{% block title %}Market Price Information{% endblock %}

{% block body %}
<!-- Page Header -->
<div class="app-head">
    <div class="wrap">
        <h1>Market Price Information</h1>
        <p>Live mandi prices from Agmarknet (data.gov.in) when available, otherwise clearly labelled reference prices.</p>
    </div>
</div>

<!-- Main Application Content -->
<main class="app">
    <div class="wrap">
        <!-- Filter Form -->
        <form id="form" class="panel inl" novalidate>
            <div>
                <label for="crop">Crop</label>
                <select id="crop" required>
                    <option value="">Select crop…</option>
                </select>
            </div>
            
            <div>
                <label for="state">State</label>
                <select id="state">
                    <option value="">All India</option>
                </select>
            </div>
            
            <button class="btn" id="go" type="submit">
                <span class="spinner"></span>
                <i class="fa-solid fa-magnifying-glass-dollar"></i> Get Mandi Prices
            </button>
        </form>

        <!-- Market Results Section -->
        <div id="result">
            <div class="panel">
                <div class="empty">
                    <i class="fa-solid fa-seedling"></i>Your results will appear here.
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
