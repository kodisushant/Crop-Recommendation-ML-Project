{% extends "base.html" %}{% block title %}Fertilizer Planning{% endblock %}{% block body %}<div class="app-head"><div class="wrap"><h1>Fertilizer Planning</h1><p>Soil N, P, K are classed low, medium or high, the crop dose is adjusted, then converted to urea, DAP and MOP.</p></div></div><main class="app"><div class="wrap"><div class="two"><form id="form" novalidate><div class="panel"><h3><i class="fa-solid fa-wheat-awn"></i> Crop</h3><label for="crop">Select crop</label><select id="crop" required></select></div><div class="panel"><h3><i class="fa-solid fa-flask"></i> Soil test and area</h3><div id="fields"></div><label for="area" style="margin-top:14px">Area (hectares)</label><input type="number" id="area" value="1" min="0.01" step="0.01" required></div><button class="btn" id="go" type="submit"><span class="spinner"></span><i class="fa-solid fa-clipboard-list"></i> Create plan</button></form><div id="result"><div class="panel"><div class="empty"><i class="fa-solid fa-seedling"></i>Your results will appear here.</div></div></div></div></div></main>{% endblock %}
